controller_server:
  ros__parameters:
    use_sim_time: True
    controller_plugins: ["FollowPath"]
    controller_frequency: 20.0  # Reduced from 50.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
            # Add lifecycle control parameters
      lifecycle_nodes:
        - controller_server
      autostart: true
      bond_timeout: 5.0
      debug_trajectory_details: False
      min_x_velocity_threshold: 0.001
      max_vel_x: 0.3  # Reduced for mecanum stability
      min_vel_x: -0.3
      max_vel_theta: 0.8  # Reduced for precision
      min_vel_theta: -0.8
      acc_lim_x: 0.25  # Smoother acceleration
      acc_lim_theta: 0.5
      decel_lim_x: 0.25
      vx_samples: 20
      vtheta_samples: 40
      path_distance_bias: 32.0
      goal_distance_bias: 20.0
      occdist_scale: 0.1
      sim_time: 2.0  # Increased for mecanum
      use_rotate_to_heading: True
      rotate_to_heading_angular_vel: 0.5
      base_frame_id: "base_footprint"
      robot_base_frame: "mobile/base_footprint"  # Namespaced frame

      action_server_name: "/mobile/follow_path"  # Add namespace
      global_frame: "map"
      global_frame_id: "map"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle:
        scale: 0.1
      PathAlign: 
        scale: 0.75
      GoalAlign:
        scale: 1.0
      PathDist:
        scale: 0.5
      GoalDist:
        scale: 0.5
      Oscillation:
        reset_distance: 0.05

planner_server:
  ros__parameters:
    global_frame: "map"
    action_server_name: "/mobile/compute_path_to_pose"  # Add namespace
    global_frame_id: "map"
    robot_base_frame: "mobile/base_footprint"  # Namespaced frame

    action_server_name: "/mobile/compute_path_to_pose"  # Add namespace
    planner_plugins: ["GridBased", "SmacPlanner2D"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: True  # Enabled for better path finding
      allow_unknown: True  # Required for SLAM mapping
    SmacPlanner2D:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      motion_model: "omni"  # For mecanu
      tolerence: 0.5
      
      
# Add this to your nav2_params.yaml
lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: 
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - smoother_server
      - waypoint_follower
      - map_server
      - amcl  # Critical addition!
      
      
    bond_timeout: 30.0  # Increased from default 10.0

behavior_server:
  ros__parameters:
    behavior_plugins: ["Spin", "BackUp", "DriveOnHeading"]
    Spin:
      plugin: "nav2_behaviors/Spin"
      spin_dist: 3.14  # Full 180° rotation (was 1.57)
      time_allowance: 10.0
    BackUp:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.15
      backup_speed: 0.025
      time_allowance: 10.0
    DriveOnHeading:
      plugin: "nav2_behaviors/DriveOnHeading"
      forward_speed: 0.25
      max_rotation_rate: 1.0
      time_allowance: 10.0

amcl:
  ros__parameters:
    use_sim_time: True
    use_map_topic: true
    first_map_only: false
    always_reset_initial_pose: false
    initial_pose:
      x: 2.0  # Match robot spawn position
      y: 2.0
      yaw: 0.0
      covariance: [0.25, 0.0, 0.0, 0.0, 0.25, 0.0, 0.0, 0.0, 0.06853892326654787]
    set_initial_pose: true  # Add this line
    alpha1: 0.2  # Increased for mecanum odometry noise
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    global_frame: "map"
    lambda_short: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000  # Increased for LIDAR
    update_min_d: 0.1       # Added for faster convergence
    update_min_a: 0.2       # Added
    min_particles: 500
    odom_frame_id: "odom"
    robot_model_type: "omni"
    tf_broadcast: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_footprint"
      robot_radius: 0.2
      footprint_padding: 0.1
      rolling_window: True
      always_send_full_costmap: false
      track_unknown_space: true
      width: 6
      height: 6
      origin_x: -3.0
      origin_y: -3.0
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/slam_toolbox/map"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: "scan"
        scan:
          topic: "/mobile/scan"
          data_type: "LaserScan"
          marking: True
          clearing: True
          sensor_frame: "mobile_lidar_link"  # Critical addition
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_footprint"
      resolution: 0.05
      always_send_full_costmap: false
      track_unknown_space: false
      width: 10
      height: 10
      origin_x: -5.0
      origin_y: -5.0      
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/slam_toolbox/map"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: "scan"
        scan:
          topic: "/mobile/scan"
          data_type: "LaserScan"
          marking: True
          clearing: True
          sensor_frame: mobile_lidar_link  # Critical addition
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
        
        
# In nav2_params.yaml (map_server section):
map_server:
  ros__parameters:
    yaml_filename: "maps/nam_house_map.yaml"  # Verify path exists
    topic_name: "/slam_toolbox/map"  # Must match SLAM output
    frame_id: "map"

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "/home/nammy/nam_ws/src/nam_patrol_robot/config/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    default_bt_xml_filename: "/home/nammy/nam_ws/src/nam_patrol_robot/config/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names: [
      "nav2_compute_path_to_pose_action_bt_node",
      "nav2_follow_path_action_bt_node",
      "nav2_back_up_action_bt_node",
      "nav2_spin_action_bt_node",
      "nav2_planner_selector_bt_node",
      "nav2_controller_selector_bt_node",
      "nav2_clear_costmap_service_bt_node"
    ]
    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odom"

waypoint_follower:
  ros__parameters:
    loop_rate: 30
    stop_on_failure: True  # Changed to True for safety
